        if: always()
        with:
          name: kernel-ci-log
          retention-days: 1
          path: ci-logs/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pong-macos-products
          retention-days: 14
          if-no-files-found: warn
          path: |
            ci-products/pong-xnu-initial.img
            ci-products/mach.development.pong
            ci-products/DarwinBoot24.efi
            ci-products/ci-manifest.json
            ci-products/boot-decision.json
